anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: llvm/llvm-project
      use_max_tag: true
      include_regex: ^llvmorg-[\d.]+$
      from_pattern: ^llvmorg-(.+)$
      to_pattern: \1
    packages:
      - flang_impl_linux-64
      - flang_impl_linux-aarch64
      - flang_impl_win-64
      - flang_impl_win-arm64
      - flang_impl_osx-arm64
      - flang_linux-64
      - flang_linux-aarch64
      - flang_win-64
      - flang_win-arm64
      - flang_osx-arm64
