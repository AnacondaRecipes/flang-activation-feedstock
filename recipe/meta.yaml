{% set version = "23.1.4" %}

package:
  name: flang-activation
  version: {{ version }}

source:
  # unused, but helpful so the bot creates updates automatically;
  # we use the _signature_, which is tiny and thus much faster to download
  url: https://github.com/llvm/llvm-project/releases/download/llvmorg-{{ version.replace(".rc", "-rc") }}/llvm-project-{{ version.replace(".rc", "-rc") }}.src.tar.xz.sig
  sha256: a9f42dbc5c6675365ea83983465b6f7316bbf95621d52e2623f51f60a8173622

build:
  number: 0
  # TODO: Skipping osx until flang is available.
  skip: true  # [osx]

outputs:
  - name: flang_impl_{{ cross_target_platform }}
    script: {{ "install_flang_impl.bat" if win else "install_flang_impl.sh" }}
    # we don't cross-compile on windows -> no symlinks
    # host and run are the same list (what conda-build makes of a flat output requirements list)
    requirements:
      host:
        - flang ={{ version }}
        - flang-rt_{{ cross_target_platform }} ={{ version }}  # Fortran runtime (new in LLVM 21)
        - lld                     # [win]
        # for llvm-ar.exe
        - llvm-tools              # [win]
        - compiler-rt ={{ version }}
      run:
        - flang ={{ version }}
        - flang-rt_{{ cross_target_platform }} ={{ version }}
        - lld                     # [win]
        - llvm-tools              # [win]
        - compiler-rt ={{ version }}
    test:
      commands:
        - {{ CBUILD }}-flang --version  # [unix]
        - {{ CHOST }}-flang --version   # [unix]
        - flang --version               # [win]

  - name: flang_{{ cross_target_platform }}
    script: {{ "install_flang.bat" if win else "install_flang.sh" }}
    run_exports:
      strong:   # [unix]
        - libflang-rt >={{ version }}  # [unix]  # Changed from libflang in LLVM 21
    requirements:
      build:
        - sed       # [unix]
        - msys2-sed  # [win]
      run:
        - {{ pin_subpackage("flang_impl_" ~ cross_target_platform, exact=True) }}
        - libflang-rt >={{ version }}  # [linux]  # Runtime shared library
    test:
      files:
        - hello_world.f90
        - test_modules.f90
        - test_flang.sh      # [unix]
        - test_flang.bat     # [win]
      commands:
        # on linux we point FC to the symlink; on windows, we point to the binary
        # the activation script hardcodes the target prefix (it must not depend on CHOST at activation time)
        - grep -q 'FC="{{ CHOST }}-flang"' $PREFIX/etc/conda/activate.d/flang_{{ cross_target_platform }}_activate.sh   # [unix]
        # compile, link and run hello_world.f90 and test_modules.f90 through the activated compiler
        - bash test_flang.sh     # [unix]
        - call test_flang.bat {{ version.split(".")[0] }} x86_64    # [win64]
        - call test_flang.bat {{ version.split(".")[0] }} aarch64   # [win and arm64]

about:
  home: https://flang.llvm.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Flang is a Fortran compiler targeting LLVM.
  description: |
    Flang is a modern Fortran compiler targeting LLVM. This package provides
    activation scripts and compiler wrappers that enable the use of Flang as
    the Fortran compiler in conda environments. It includes platform-specific
    configurations for cross-compilation support and ensures proper integration
    with the conda build system for Fortran projects.
  doc_url: https://flang.llvm.org
  dev_url: https://github.com/llvm/llvm-project

extra:
  recipe-maintainers:
    - isuruf
    - h-vetinari
